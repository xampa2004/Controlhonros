plugins { id 'com.android.application' }

android {
    namespace 'es.controlhornos.app'
    compileSdk 35
    defaultConfig {
        applicationId 'es.controlhornos.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '3.3'
    }
    signingConfigs {
        // Firma de verdad (no la de depuración): Play Protect es menos quisquilloso y la app no es "debuggable".
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
}
